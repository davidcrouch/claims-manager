slug: create-assessment
name: Assessment – Create & Complete
description: |
  When asked to "create assessment": gather all job data (claim, contacts, appointments, reports,
  journals), create the assessment with all sections pre-populated, then walk
  through each of the 9 tab drawers for the user to review. When asked for a "new assessment":
  just open the blank create form.
triggerHints:
  - create assessment
  - new assessment
  - start assessment
  - add assessment
  - begin assessment
  - open assessment form
  - make a new assessment
instructionPrompt: |
  You are helping the user create a new site assessment for a job.

  IMPORTANT — detect the user's intent:
  • "new assessment" / "open assessment form" → QUICK START path (step A below).
  • "create assessment" / "start assessment" / "begin assessment" → FULL DATA path (step B below).
  If ambiguous, ask which they prefer: "Would you like me to just open a blank form, or
  gather job data and pre-fill everything for you?"

  ── A. QUICK START ──
  1. Call open_create_assessment immediately (pass jobId from page context when available).
  2. Tell the user the form is open and they can fill it manually.
  3. Offer: "Say 'create assessment' any time and I'll gather all the job data to help fill it."
  Done.

  ── B. FULL DATA-DRIVEN CREATION (wizard) ──

  PHASE 1 — GATHER ALL EVIDENCE
  Resolve jobId, then call these in parallel where possible:

  a. JOB — call get_job. Note job type, status, description, risk address, event date,
     external reference, and any embedded claim fields.

  b. CLAIM — if the job has a claimId, call get_claim. Extract:
     • Event type and date of loss (→ damage cause, recommendation)
     • Policy holder / insured name and contact details
     • Claim number / reference
     • Any policy notes or event description

  c. CONTACTS — call list_contacts_by_job. Look for:
     • Builder / estimator (name, phone → attendance)
     • Insurance assessor (name, phone → attendance)
     • Insured / homeowner (name → attendance "persons attending")
     • Any specialist contacts (→ specialists tab)

  d. APPOINTMENTS — call list_appointments_by_job. Look for:
     • Completed site visit dates (→ attendance "site attendance date")
     • Attendee names from appointment records
     • Appointment notes or outcomes

  e. REPORTS — call list_reports_by_job. For each relevant report, call get_report. Look for:
     • Prior assessment or inspection findings
     • Building details, damage observations, hazard notes
     • Recommendations from earlier inspections

  f. JOURNALS — call list_journals with jobId (or list_journals_by_entity with entityType=job).
     Show the user a short numbered list (name/title, date, page count if available).
     Ask which journal(s) apply — wait for selection. If only one journal exists, confirm it.
     For each selected journal:
     • list_journal_pages → get_journal_page for each entry.
     • Read body/notes text and every content block.
     • For photo attachments: get_journal_page_attachment_download for a download URL.
       Use filenames, captions, metadata. If you cannot visually inspect the image, ask
       the user what it shows.

  PHASE 2 — CREATE THE ASSESSMENT (with all sections pre-populated)
  Using all gathered evidence, build the full assessment payload and call create_assessment
  directly. Do NOT use the create drawer form — call the API tool with all section data:

  {
    "data": {
      "name": "Site Assessment – [risk address] – [date]",
      "jobId": "<jobId>",
      "attendance": { addressAttended, siteAttendanceDate, personsAttending,
                      builderEstimatorName, builderEstimatorPhone,
                      insuranceAssessorAttended, insuranceAssessorName,
                      insuranceAssessorPhone, occupancyType },
      "building":   { houseM2, estimatedBuildYear, buildingType, designType,
                      constructionType, roofType, additionalStructures,
                      mainHouseRoofDamage, propertyCondition, furnitureRemovalStorage },
      "habitability": { habitable, uninhabitableReason },
      "hazards":    { hazardDetails: { poolFencing, electrical, sewerage, structural },
                      safetyHazards, environmentalHazards },
      "damage":     { damageObserved, causeOfDamage, hasDamageCoveredByPolicy,
                      preExistingMaintenanceIssues, preExistingRelateDamage,
                      maintenanceDefectIssues, worksRequiredToAddressDamage },
      "makeSafe":   { makeSafeRequired, makeSafeType, dateMakeSafeCompleted,
                      dateMainRoofRepaired },
      "temporaryAccommodation": { required, estimatedAmount, estimatedDuration,
                      requiredImmediately, immediateEstimateDays,
                      requiredDuringRepairs, repairsEstimateDays,
                      tempRepairsToMakeLivable, workWhileInAccommodation },
      "specialists": { specialistRequired, specialistType },
      "recommendation": { claimRecommendation, costEstimateForRepairs,
                      estimatedRepairTime, estimatedRepairDuration,
                      hasInsuredAdvised, clientWillingToProceed,
                      customerArrangedRepairs, arrangedRepairComments,
                      clientDiscussions, specialNotes, conclusion, builderLicenses }
    }
  }

  Only include fields you have evidence for — omit unknown fields entirely.
  Tell the user: "I've created the assessment with [N] fields pre-filled from [sources].
  Let me walk you through each section so you can review and adjust."

  PHASE 3 — TAB-BY-TAB REVIEW (wizard walk-through)
  Walk through each tab sequentially. For each tab:
  1. Open the tab drawer: call open_assessment_<tab> with the new assessmentId.
  2. The drawer will load the section data that was saved during creation.
  3. Present a short review of what was filled and the evidence source for each value.
  4. Ask the user if anything needs changing. If they provide corrections,
     call fill_assessment_<tab> with the updated values.
  5. When the user confirms, save with update_assessment_<tab>.
  6. Move to the next tab.

  Tab order:
  1. Attendance — evidence: contacts, appointments, claim (insured name), journals
  2. Building — evidence: journals (photos, notes), reports
  3. Habitability — evidence: journals (livability notes), damage severity
  4. Hazards — evidence: journals (hazard observations, photos)
  5. Damage & Cause — evidence: journals, claim (event type/date), reports
  6. Make Safe — evidence: journals (emergency works), job description
  7. Temp Accommodation — evidence: journals (habitability), claim details
  8. Specialists — evidence: journals (specialist mentions), contacts, reports
  9. Recommendation — evidence: ALL sources combined

  After all 9 tabs:
  - Offer to validate: call validate_assessment.
  - If valid, offer to publish: call publish_assessment.
  - If validation errors, show them and offer to fix.

  Rules:
  - Do NOT invent dates, people, costs, or recommendations.
  - Always cite the evidence source when filling a field.
  - If a data source returns empty results, skip it silently — do not tell the user
    "no contacts found" unless it prevents filling a required field.
  - Prefer evidence; if unsure, ask.
  - If the user wants to skip a tab during review, move to the next one.
  - If the user wants to stop the wizard early, confirm and stop.
