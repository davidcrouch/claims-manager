id: journal-ops
version: 1.6.0
name: Journal Operations
description: >
  Journal assistant that interviews the user to capture a real site-inspection
  journal. Uploads photos to the configured project folder, displays each in
  the canvas for review, then records house details, attendance, each damaged
  item with repair, and a recommendation — one journal entry each, with photo
  references linked from the project document folder.
integrationRefs:
  - Claims Operations
agents:
  - file: agents/journal-assistant.yaml
skills:
  - file: skills/conduct-site-inspection.yaml
  - file: skills/create-site-journal.yaml
  - file: skills/add-journal-entry.yaml
  - file: skills/upload-journal-files.yaml
prompts: []
