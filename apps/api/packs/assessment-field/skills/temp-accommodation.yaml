slug: assessment-temp-accommodation
name: Assessment – Temp Accommodation
description: Collect temporary accommodation details by reviewing job journals (entries, notes, photos), then filling the form.
triggerHints:
  - temporary accommodation assessment
  - temp accommodation
  - loss of rent
  - accommodation during repairs
  - required immediately
instructionPrompt: |
  You are helping the user complete the Temp Accommodation tab of a site assessment.

  Workflow:
  1. Confirm assessmentId. Call open_assessment_tempAccommodation and get_assessment. Resolve jobId
     (from the assessment, page context, or user). Call get_job.
  2. Journal review (do this before answering form questions):
     a. Call list_journals with jobId (or list_journals_by_entity with entityType=job).
     b. Show the user a short list of journals (name/title, date, page count if available).
     c. Ask which journal(s) apply to this assessment — wait for their selection.
        If only one journal exists, confirm it before opening.
     d. For each selected journal: call list_journal_pages to get all entries.
     e. For each entry: call get_journal_page. Read the body/notes text and every content block
        (blocks[].type === "note" → read text; blocks[].type === "upload" → check attachment).
     f. For photo/image attachments: call get_journal_page_attachment_download for a download URL.
        Use filenames, captions, and metadata. If you cannot visually inspect the image, ask the
        user what the photo shows that is relevant to Temp Accommodation.
  3. Using job data + journal entries/notes/photos, infer TA answers. Call
     fill_assessment_tempAccommodation with all inferred fields.
  4. Present a short review. Ask only for unknowns. After each user answer, call
     fill_assessment_tempAccommodation.
  5. Field checklist:
     - TA / loss of rent required (No / Yes, Temporary Accommodation / Yes, Loss of Rent)
     - Estimated amount
     - Estimated duration (e.g. "14 Days")
     - Required immediately (yes/no); if yes: immediate estimate (days)
     - Required during repairs (yes/no); if yes: during-repairs estimate (days)
     - Temporary repairs to make livable
     - Work while in accommodation
  6. Ask the user to review the canvas form. On confirmation, save with
     update_assessment_tempAccommodation (or let them click Save).
  Rules: Do not invent dollar amounts or day counts. Prefer journal evidence; if unsure, ask.
requiredToolRefs:
  - integration: Claims Operations
    tool: open_assessment_tempAccommodation
  - integration: Claims Operations
    tool: fill_assessment_tempAccommodation
  - integration: Claims Operations
    tool: update_assessment_tempAccommodation
  - integration: Claims Operations
    tool: get_assessment
  - integration: Claims Operations
    tool: get_job
  - integration: Claims Operations
    tool: list_journals
  - integration: Claims Operations
    tool: get_journal
  - integration: Claims Operations
    tool: list_journal_pages
  - integration: Claims Operations
    tool: get_journal_page
  - integration: Claims Operations
    tool: get_journal_page_attachment_download
category: assessments
invocationMode: inline
