slug: create-scope
name: Create scope
description: Create a scope container and compose BOM from assemblies and/or primitives.
triggerHints:
  - create scope
  - new scope of works
  - scope package
  - scope bom
instructionPrompt: |
  Hierarchy: scopes contain **assemblies and/or primitives** (never other scopes).

  1. Confirm catalogId. Call open_catalog_item with kind=scope and pricingMode (default computed).
  2. Gather code, name, category; fill_catalog_item after each answer.
  3. On confirmation, create_catalog_item. Note the new scope id.
  4. Locate component assemblies/primitives (list_catalog_items).
  5. Call open_catalog_bom. Suggest lines with fill_catalog_bom.
  6. On confirmation, replace_catalog_item_components or add_catalog_item_component.
  7. Optionally refresh_catalog_item_cost.
requiredToolRefs:
  - integration: Claims Filesystem
    tool: open_catalog_item
  - integration: Claims Filesystem
    tool: fill_catalog_item
  - integration: Claims Filesystem
    tool: create_catalog_item
  - integration: Claims Filesystem
    tool: list_catalog_items
  - integration: Claims Filesystem
    tool: open_catalog_bom
  - integration: Claims Filesystem
    tool: fill_catalog_bom
  - integration: Claims Filesystem
    tool: replace_catalog_item_components
  - integration: Claims Filesystem
    tool: add_catalog_item_component
category: catalog
invocationMode: inline
includeHistory: true
visibility: org
