name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Build and push ALL Docker images (skip path filters)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: australia-southeast1-docker.pkg.dev/claims-manager-infra-493807/claims-manager

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api typecheck
      - run: pnpm -r build
      - run: pnpm --filter api test

  prepare-docker:
    runs-on: ubuntu-latest
    needs: [node-ci]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      api-server: ${{ steps.decide.outputs.api-server }}
      auth-server: ${{ steps.decide.outputs.auth-server }}
      frontend: ${{ steps.decide.outputs.frontend }}
      provider-server: ${{ steps.decide.outputs.provider-server }}
      claims-mcp: ${{ steps.decide.outputs.claims-mcp }}
      ms-graph-mcp: ${{ steps.decide.outputs.ms-graph-mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        run: echo "image_tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-server:
              - 'apps/api/**'
              - 'packages/**'
              - 'data/**'
            auth-server:
              - 'apps/auth-server/**'
              - 'packages/telemetry/**'
            frontend:
              - 'apps/frontend/**'
            provider-server:
              - 'apps/provider/**'
            claims-mcp:
              - 'apps/claims-mcp/**'
            ms-graph-mcp:
              - 'apps/ms-graph-mcp/**'

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - id: decide
        name: Decide which images to build
        run: |
          for image in api-server auth-server frontend provider-server claims-mcp ms-graph-mcp; do
            case "$image" in
              api-server) changed="${{ steps.changes.outputs.api-server }}" ;;
              auth-server) changed="${{ steps.changes.outputs.auth-server }}" ;;
              frontend) changed="${{ steps.changes.outputs.frontend }}" ;;
              provider-server) changed="${{ steps.changes.outputs.provider-server }}" ;;
              claims-mcp) changed="${{ steps.changes.outputs.claims-mcp }}" ;;
              ms-graph-mcp) changed="${{ steps.changes.outputs.ms-graph-mcp }}" ;;
            esac
            if gcloud artifacts docker images describe "${{ env.REGISTRY }}/${image}:latest" > /dev/null 2>&1; then
              existed=true
            else
              existed=false
            fi
            if [ "${{ inputs.force_build_all }}" = "true" ] || [ "$changed" = "true" ] || [ "$existed" = "false" ]; then
              echo "${image}=true" >> "$GITHUB_OUTPUT"
              echo "Will BUILD ${image} (changed=${changed} existed=${existed} force=${{ inputs.force_build_all }})"
            else
              echo "${image}=false" >> "$GITHUB_OUTPUT"
              echo "Will RETAG ${image}"
            fi
          done

  docker-build:
    runs-on: ubuntu-latest
    needs: [prepare-docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-server
            dockerfile: apps/api/Dockerfile
          - service: auth-server
            dockerfile: apps/auth-server/Dockerfile
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
          - service: provider-server
            dockerfile: apps/provider/Dockerfile
          - service: claims-mcp
            dockerfile: apps/claims-mcp/Dockerfile
          - service: ms-graph-mcp
            dockerfile: apps/ms-graph-mcp/Dockerfile
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Build & push ${{ matrix.service }}
        env:
          IMAGE_TAG: ${{ needs.prepare-docker.outputs.image_tag }}
          BUILD_API: ${{ needs.prepare-docker.outputs.api-server }}
          BUILD_AUTH: ${{ needs.prepare-docker.outputs.auth-server }}
          BUILD_FRONTEND: ${{ needs.prepare-docker.outputs.frontend }}
          BUILD_PROVIDER: ${{ needs.prepare-docker.outputs.provider-server }}
          BUILD_CLAIMS_MCP: ${{ needs.prepare-docker.outputs.claims-mcp }}
          BUILD_MS_GRAPH_MCP: ${{ needs.prepare-docker.outputs.ms-graph-mcp }}
        run: |
          case "${{ matrix.service }}" in
            api-server) SHOULD_BUILD="$BUILD_API" ;;
            auth-server) SHOULD_BUILD="$BUILD_AUTH" ;;
            frontend) SHOULD_BUILD="$BUILD_FRONTEND" ;;
            provider-server) SHOULD_BUILD="$BUILD_PROVIDER" ;;
            claims-mcp) SHOULD_BUILD="$BUILD_CLAIMS_MCP" ;;
            ms-graph-mcp) SHOULD_BUILD="$BUILD_MS_GRAPH_MCP" ;;
          esac
          if [ "$SHOULD_BUILD" != "true" ]; then
            echo "Skipping build for ${{ matrix.service }} (will be re-tagged in ensure-tags)"
            exit 0
          fi
          docker build -f ${{ matrix.dockerfile }} \
            -t ${{ env.REGISTRY }}/${{ matrix.service }}:${IMAGE_TAG} \
            -t ${{ env.REGISTRY }}/${{ matrix.service }}:latest \
            .
          docker push --all-tags ${{ env.REGISTRY }}/${{ matrix.service }}
          docker system prune -af

  ensure-tags:
    runs-on: ubuntu-latest
    needs: [prepare-docker, docker-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Re-tag unchanged images + verify
        env:
          IMAGE_TAG: ${{ needs.prepare-docker.outputs.image_tag }}
        run: |
          FAILED=0
          for image in api-server auth-server frontend provider-server claims-mcp ms-graph-mcp; do
            case "$image" in
              api-server) built="${{ needs.prepare-docker.outputs.api-server }}" ;;
              auth-server) built="${{ needs.prepare-docker.outputs.auth-server }}" ;;
              frontend) built="${{ needs.prepare-docker.outputs.frontend }}" ;;
              provider-server) built="${{ needs.prepare-docker.outputs.provider-server }}" ;;
              claims-mcp) built="${{ needs.prepare-docker.outputs.claims-mcp }}" ;;
              ms-graph-mcp) built="${{ needs.prepare-docker.outputs.ms-graph-mcp }}" ;;
            esac
            if [ "$built" != "true" ]; then
              echo "Re-tagging ${image}:latest → ${image}:${IMAGE_TAG}"
              if ! gcloud artifacts docker tags add \
                "${{ env.REGISTRY }}/${image}:latest" \
                "${{ env.REGISTRY }}/${image}:${IMAGE_TAG}" 2>&1; then
                echo "::error::Failed to re-tag ${image}"
                FAILED=1
              fi
            fi
            if ! gcloud artifacts docker images describe \
              "${{ env.REGISTRY }}/${image}:${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "::error::Image ${image}:${IMAGE_TAG} not found"
              FAILED=1
            else
              echo "✓ ${image}:${IMAGE_TAG}"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Missing images. Run workflow_dispatch with force_build_all=true."
            exit 1
          fi
