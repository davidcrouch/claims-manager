name: Deploy Cloud Run Production

# Opt-in: runs after successful CI on semver tags (e.g. v1.2.3) or manual dispatch.
# Same Cloud Run matrix as staging; terraform owns SA / VPC / secrets / sizing.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty to use the git tag / SHA)"
        required: false

concurrency:
  group: deploy-cloudrun-production
  cancel-in-progress: false

env:
  PROD_PROJECT: claims-manager-prod-493807
  GCP_REGION: australia-southeast1
  REGISTRY: australia-southeast1-docker.pkg.dev/claims-manager-infra-493807/claims-manager

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provider-server
          - service: api-server
          - service: auth-server
          - service: frontend
          - service: claims-mcp
          - service: ms-graph-mcp
    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # workflow_run on a tag: head_branch is the tag name (e.g. v1.2.3)
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${IMAGE_TAG}"
          echo "Deploying ${{ matrix.service }} → ${IMAGE}"
          if ! gcloud run services describe "${{ matrix.service }}" \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::Cloud Run service ${{ matrix.service }} not found. Apply production terraform first."
            exit 0
          fi
          gcloud run services update "${{ matrix.service }}" \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE}"

  sync-platform-assets:
    needs: [deploy]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync platform templates to GCS
        run: |
          BUCKET="claims-manager-production-documents"
          echo "Syncing data/templates/seed/ → gs://${BUCKET}/platform/templates/"
          gcloud storage cp data/templates/seed/*.docx "gs://${BUCKET}/platform/templates/"

  migrate:
    needs: [deploy]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run migrate-api Job
        run: |
          if ! gcloud run jobs describe migrate-api \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::migrate-api job missing; skip"
            exit 0
          fi
          gcloud run jobs update migrate-api \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/api-server:${IMAGE_TAG}"
          gcloud run jobs execute migrate-api \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait

  seed-rbac:
    needs: [migrate]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run seed-auth-rbac Job
        run: |
          if ! gcloud run jobs describe seed-auth-rbac \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::seed-auth-rbac job missing; apply production terraform then re-run CD"
            exit 0
          fi
          gcloud run jobs update seed-auth-rbac \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/auth-server:${IMAGE_TAG}"
          gcloud run jobs execute seed-auth-rbac \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait

  seed-lookups:
    needs: [migrate]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run seed-api-lookups Job
        run: |
          if ! gcloud run jobs describe seed-api-lookups \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::seed-api-lookups job missing; apply production terraform then re-run CD"
            exit 0
          fi
          gcloud run jobs update seed-api-lookups \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/api-server:${IMAGE_TAG}" \
            --task-timeout=15m
          gcloud run jobs execute seed-api-lookups \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait

  ingest-guides:
    needs: [migrate]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run ingest-api-guides Job
        run: |
          if ! gcloud run jobs describe ingest-api-guides \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::error::ingest-api-guides job missing; apply production terraform (cloud_run.tf) then re-run CD"
            exit 1
          fi
          gcloud run jobs update ingest-api-guides \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/api-server:${IMAGE_TAG}" \
            --task-timeout=15m
          gcloud run jobs execute ingest-api-guides \
            --project "${PROD_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait
