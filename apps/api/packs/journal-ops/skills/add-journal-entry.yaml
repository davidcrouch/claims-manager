slug: add-journal-entry
name: Add journal site entry
description: >
  Add one real site-inspection entry from the user's photos and answers.
  One thing looked at per entry. Optional repair note. No invented content.
triggerHints:
  - add journal entry
  - add inspection entry
  - record damage in journal
  - add scope of work to journal
  - add photos to journal
instructionPrompt: |
  Add site-inspection entry/entries to an existing journal from what the user
  told you or showed in photos. Do not invent. No headings or labels in the
  note text. One stop = one entry. If they mention a smashed roof AND a broken
  window, call create_journal_site_entry twice.

  1. Confirm journalId (page context or this conversation). Call get_journal if needed.
  2. If they attached photos, review them and confirm what each item is before writing.
  3. Choose entryKind: intro | pre_existing | observation | recommendation | other.
  4. name: short place/item for the timeline ("Entry door"), not a report heading.
  5. observation: what is wrong / what was recorded, this item only. No "Observation:" prefix.
  6. For an event item, optional scopeOfWork: how to fix THIS item only —
     conversational, no "Scope of work:" heading.
  7. locationLabel = room/area. capturedAt if known.
  8. If the item has associated photos that were uploaded to the project folder,
     pass their documentIds so they are linked to the entry.
  9. Call create_journal_site_entry once per item. Never use create_journal_page
     for inspection notes. Omit the images field unless the user explicitly asks
     you to generate a photo.

  Intro / house / wrap-up: no repair aside. Pre-existing: repair aside only if asked.
  Ask a short follow-up only for facts you still need (cause, repair, event vs old).
requiredToolRefs:
  - integration: Claims Operations
    tool: get_journal
  - integration: Claims Operations
    tool: create_journal_site_entry
category: journals
invocationMode: inline
includeHistory: true
visibility: org
