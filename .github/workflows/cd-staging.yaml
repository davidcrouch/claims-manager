name: Deploy Cloud Run Staging

# Deploys api/auth/frontend/provider/claims-mcp/ms-graph-mcp Cloud Run revisions after CI succeeds.
# See deploy/CLOUD_RUN.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (leave empty to use main-<sha>)"
        required: false

concurrency:
  group: deploy-cloudrun-staging
  cancel-in-progress: false

env:
  STAGING_PROJECT: claims-manager-staging-493807
  GCP_REGION: australia-southeast1
  REGISTRY: australia-southeast1-docker.pkg.dev/claims-manager-infra-493807/claims-manager

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: provider-server
          - service: api-server
          - service: auth-server
          - service: frontend
          - service: claims-mcp
          - service: ms-graph-mcp
    steps:
      - name: Resolve source SHA / tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "DEPLOY_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Set image tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${DEPLOY_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ matrix.service }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${IMAGE_TAG}"
          echo "Deploying ${{ matrix.service }} → ${IMAGE}"
          if ! gcloud run services describe "${{ matrix.service }}" \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::Cloud Run service ${{ matrix.service }} not found. Apply staging terraform first."
            exit 0
          fi
          gcloud run services update "${{ matrix.service }}" \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE}"

  sync-platform-assets:
    needs: [deploy]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync platform templates to GCS
        run: |
          BUCKET="claims-manager-staging-documents"
          echo "Syncing data/templates/ → gs://${BUCKET}/platform/templates/"
          gcloud storage cp data/templates/*.docx "gs://${BUCKET}/platform/templates/"

  migrate:
    needs: [deploy]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run migrate-api Job
        run: |
          if ! gcloud run jobs describe migrate-api \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::migrate-api job missing; skip"
            exit 0
          fi
          gcloud run jobs update migrate-api \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/api-server:${IMAGE_TAG}"
          gcloud run jobs execute migrate-api \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait

  seed-rbac:
    needs: [migrate]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=main-${SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-deployer@claims-manager-infra-493807.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run seed-auth-rbac Job
        run: |
          if ! gcloud run jobs describe seed-auth-rbac \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" > /dev/null 2>&1; then
            echo "::warning::seed-auth-rbac job missing; apply staging terraform then re-run CD"
            exit 0
          fi
          gcloud run jobs update seed-auth-rbac \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" \
            --image "${{ env.REGISTRY }}/auth-server:${IMAGE_TAG}"
          gcloud run jobs execute seed-auth-rbac \
            --project "${STAGING_PROJECT}" \
            --region "${GCP_REGION}" \
            --wait
